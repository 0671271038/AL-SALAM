<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Thank You - AL-SALAM</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#F6FAF7] min-h-screen flex items-center justify-center p-6">
<div class="bg-white max-w-[520px] w-full rounded-[2rem] p-8 text-center shadow-xl">
<div class="text-4xl">🤲</div>
<p class="font-bold mt-4" style="font-family:'Amiri'; font-size:28px; color:#0e7c4b">جَزَاكَ ٱللَّٰهُ خَيْرًا</p>
<h1 class="text-3xl font-extrabold" style="font-family:'Plus Jakarta Sans'">JazakAllah Khair!</h1>
<p class="text-sm text-slate-500 mt-2">Your donation details are being sent...</p>

<div id="details" class="mt-6 text-left bg-[#F6FAF7] p-4 rounded-2xl text-sm"></div>

<a id="waBtn" href="#" target="_blank" class="mt-6 block w-full bg-[#25D366] text-white py-4 rounded-full font-bold">💬 Confirm on WhatsApp - 062 716 5789</a>
<p id="emailStatus" class="text-xs text-slate-400 mt-3">Sending email to salamhelp26@gmail.com...</p>
<a href="index.html" class="mt-4 block text-sm text-slate-500">← Back to Home</a>
</div>

<script>
const d = JSON.parse(localStorage.getItem('alsalam_donor')||'{}');
document.getElementById('details').innerHTML = `<b>Name:</b> ${d.name||''}<br><b>Type:</b> ${d.type||''}<br><b>Amount:</b> R${d.amount||''}<br><b>Email:</b> ${d.email||''}`;

// 1. Prepare WhatsApp link
const waText = `Assalamualaikum AL-SALAM Foundation,%0A%0AI donated via website:%0AName: ${d.name}%0AEmail: ${d.email}%0AType: ${d.type}%0AAmount: R${d.amount}%0AMessage: ${d.msg||''}%0ADate: ${d.date}`;
const waUrl = `https://wa.me/27627165789?text=${waText}`;
document.getElementById('waBtn').href = waUrl;

// 2. Try to send email in background (no black screen because we are already on thankyou)
fetch('https://formsubmit.co/ajax/salamhelp26@gmail.com', {
 method:'POST',
 headers:{'Content-Type':'application/json'},
 body: JSON.stringify({name:d.name,email:d.email,amount:d.amount,type:d.type,message:d.msg,_subject:`New Donation R${d.amount} - ${d.name}`,_captcha:'false'})
}).then(r=>{ document.getElementById('emailStatus').innerText='✅ Email sent to salamhelp26@gmail.com!'; })
.catch(()=>{ document.getElementById('emailStatus').innerText='⚠️ Email will be sent via WhatsApp. Click green button above.'; });

// Auto open WhatsApp after 2 sec (if not blocked)
setTimeout(()=>{ window.open(waUrl,'_blank'); }, 2000);
</script>
</body></html>
