<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donate - AL-SALAM</title>
  <style>
    body { font-family: Arial; background: #f0f8f5; padding: 20px; text-align: center; }
    .box { background: white; max-width: 400px; margin: auto; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
    h1 { color: #0f9d58; }
    label { display: block; text-align: left; margin-top: 15px; font-weight: bold; color: #0f9d58; }
    input { width: 100%; padding: 12px; margin-top: 5px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    button { background: #0f9d58; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    button:hover { background: #0b7a43; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🕌 Donate to AL-SALAM</h1>
    <p>Feeding 60+ children daily in Inanda</p>
    
    <!-- IMPORTANT: Replace YOUR_EMAIL_HERE with your real email -->
    <form action="https://formsubmit.co/salamhelp26@email.com" method="POST">
      
      <!-- These 3 lines make it work -->
      <input type="hidden" name="_next" value="thankyou.html">
      <input type="hidden" name="_subject" value="New AL-SALAM Donation">
      <input type="hidden" name="_captcha" value="false">

      <label>Name</label>
      <input type="text" name="Name" required>

      <label>Email</label>
      <input type="email" name="Email" required>

      <label>Amount R</label>
      <input type="number" name="Amount" placeholder="50" required>

      <button type="submit">Donate Now</button>
    </form>
  </div>
</body>
</html>
