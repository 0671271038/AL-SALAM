<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donate to AL-SALAM</title>
<style>
body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
.container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 10px; }
h1 { color: #2d6a4f; text-align: center; }
input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
button { width: 100%; padding: 15px; background: #2d6a4f; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
button:hover { background: #1b4332; }
</style>
</head>
<body>
<div class="container">
<h1>Donate to AL-SALAM</h1>
<form action="https://formsubmit.co/salamhelp26@gmail.com" method="POST">
  <input type="hidden" name="_subject" value="New AL-SALAM Donation">
  <input type="hidden" name="_next" value="/thankyou.html">
  <input type="hidden" name="_captcha" value="false">
  <label>Donation Type</label>
  <label>Donation Type</label>
<select name="donation_type" required>
  <option value="">-- Select Donation Type --</option>
  <option value="Zakat">Zakat</option>
  <option value="Sadaqah">Sadaqah</option>
  <option value="Lillah">Lillah</option>
  <option value="FeedingProgramme">Feeding Programme</option>
  <option value="Water Project">Water Project</option>
  <option value="Masjid Build">Masjid Build</option>
</select>

<label>Full Name</label>
<input type="text" name="name" placeholder="Full Name" required>

<label>Email</label>
<input type="email" name="email" placeholder="Email" required>

<label>Amount (R)</label>
<input type="number" name="amount" placeholder="Amount (R)" required>
  <label>Message</label>


  
  <textarea name="Message"></textarea>


  <a href="donate.html">Donate Now</a>
</form>
</div>
</body>
</html>
