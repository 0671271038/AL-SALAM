<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donate - AL-SALAM</title>

  <style>
    /* AL-SALAM Brand Colors */
    :root {
      --alsalam-green: #0f9d58;
      --alsalam-dark: #0b7a45;
      --alsalam-light: #e8f5e9;
      --text-dark: #333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #fff;
      padding: 20px;
      color: var(--text-dark);
    }
    h2 {
      color: var(--alsalam-green);
      text-align: center;
      margin-bottom: 25px;
      font-size: 24px;
    }

    form {
      background: var(--alsalam-light);
      padding: 25px;
      border-radius: 15px;
      border: 2px solid var(--alsalam-green);
      max-width: 500px;
      margin: 0 auto;
      box-shadow: 0 4px 12px rgba(15, 157, 88, 0.15);
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 5px 0;
      color: var(--alsalam-dark);
    }

    label span {
      color: red;
    }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    select {
      width: 100%;
      padding: 12px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
      transition: 0.3s;
    }

    input:focus,
    select:focus {
      border-color: var(--alsalam-green);
      outline: none;
      box-shadow: 0 0 0 3px rgba(15, 157, 88, 0.2);
    }

    .donate-btn {
      width: 100%;
      background: var(--alsalam-green);
      color: white;
      font-size: 18px;
      font-weight: bold;
      padding: 15px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 4px 15px rgba(15, 157, 88, 0.4);
      transition: all 0.3s ease;
    }

    .donate-btn:hover {
      background: var(--alsalam-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(15, 157, 88, 0.6);
    }

    @media (max-width: 600px) {
      form {
        padding: 20px 15px;
      }
      h2 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <h2>🕌 Donate to AL-SALAM</h2>
  
<form action="https://formsubmit.co/salamhelp26@gmail.com" method="POST">
  <input type="hidden" name="_next" value="https://0671271038.github.io/thankyou.html">
  <input type="hidden" name="_subject" value="New AL-SALAM Donation">
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_noverify" value="true">
<input type="hidden" name="_next" value="https://0671271038.github.io/thankyou.html">
  <label>Type:</label>
  <input type="text" name="Type" required>

  <label>Name:</label>
  <input type="text" name="Name" required>

  <label>Email:</label>
  <input type="email" name="Email" required>

  <label>Amount:</label>
  <input type="number" name="Amount" required>

  <button type="submit">Donate Now</button>
</form>

</body>
</html>
