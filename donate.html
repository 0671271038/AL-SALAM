<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Donate - AL-SALAM</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#F6FAF7] min-h-screen flex items-center justify-center p-6">
<div class="bg-white max-w-[480px] w-full rounded-[2rem] p-8 shadow-xl">
<h2 class="text-2xl font-extrabold" style="font-family:'Plus Jakarta Sans'">Donate to AL-SALAM</h2>
<form id="f" class="mt-6 space-y-3">
<select id="type" required class="w-full p-4 rounded-full bg-gray-50 border"><option value="">Donation Type</option><option>Zakat</option><option>Sadaqah</option><option>Lillah</option><option>Feeding Programme</option><option>Water Project</option></select>
<input id="name" required placeholder="Full Name" class="w-full p-4 rounded-full bg-gray-50 border">
<input id="email" required type="email" placeholder="Email" class="w-full p-4 rounded-full bg-gray-50 border">
<input id="amount" required type="number" placeholder="Amount (R)" class="w-full p-4 rounded-full bg-gray-50 border font-bold">
<input id="msg" placeholder="Message / Dua" class="w-full p-4 rounded-full bg-gray-50 border">
<button class="w-full bg-[#0e7c4b] text-white p-4 rounded-full font-bold">Donate Now → Thank You</button>
</form>
</div>
<script>
document.getElementById('f').onsubmit=(e)=>{
 e.preventDefault();
 localStorage.setItem('alsalam_donor', JSON.stringify({
  type: type.value, name: name.value, email: email.value, amount: amount.value, msg: msg.value, date: new Date().toLocaleString()
 }));
 location.href='./thankyou.html';
}
</script>
</body></html>
