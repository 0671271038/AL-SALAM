<!DOCTYPE html>
<html lang="en">
<head>
  <title>Donate - AL-SALAM FOUNDATION</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f0fdf4;
      margin: 0;
      padding: 15px;
    }
    .form-container {
      background: white;
      padding: 25px 20px;
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
      border-top: 5px solid #059669;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 { 
      color: #059669; 
      text-align: center; 
      margin: 0 0 20px 0;
      font-size: 24px;
    }
    label { 
      display: block; 
      margin-top: 15px; 
      font-weight: bold; 
      color: #065f46; 
      font-size: 16px;
    }
    input, select { 
      width: 100%; 
      padding: 14px;
      margin-top: 5px; 
      border: 2px solid #d1fae5; 
      border-radius: 8px; 
      font-size: 16px; 
    }
    button { 
      width: 100%; 
      padding: 16px;
      margin-top: 25px; 
      background: #059669; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-size: 18px; 
      font-weight: bold; 
      cursor: pointer; 
    }
    .whatsapp-box {
      text-align:center; 
      margin-top:30px; 
      padding-top:20px; 
      border-top:2px dashed #d1fae5;
    }
    .whatsapp-btn {
      display:inline-block; 
      background:#25D366; 
      color:white; 
      padding:14px 20px; 
      border-radius:8px; 
      text-decoration:none; 
      font-weight:bold; 
      font-size:16px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Donate to AL-SALAM</h2>
    
    <!-- OPTION 1: EMAIL FORM -->
    <form action="https://formsubmit.co/salamhelp26@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="New AL-SALAM Donation">
      <input type="hidden" name="_next" value="https://671271038.github.io/thankyou.html">
      <input type="hidden" name="_captcha" value="false">

      <label>Donation Type</label>
      <select name="donation_type" required>
        <option value="">-- Select Donation Type --</option>
        <option value="Zakat">Zakat</option>
        <option value="Sadaqah">Sadaqah</option>
        <option value="Lillah">Lillah</option>
        <option value="Feeding Programme">Feeding Programme</option>
        <option value="Masjid Build">Masjid Build </option>
        <option value="Water Project">Water Project </option>
      </select>

      <label>Full Name</label>
      <input type="text" name="name" placeholder="Full Name" required>

      <label>Email</label>
      <input type="email" name="email" placeholder="Email" required>

      <label>Amount (R)</label>
      <input type="number" name="amount" placeholder="Amount (R)" required>

      <label>Message</label>
      <input type="text" name="message" placeholder="Optional message">

      <button type="submit">Send Donation Details via Email</button>
    </form>

    <!-- OPTION 2: WHATSAPP BUTTON -->
    <div class="whatsapp-box">
      <p style="color:#065f46; font-weight:bold;">Or Chat with us on WhatsApp</p>
      
      <a href="https://wa.me/27671271038?text=Assalamualaikum%20AL-SALAM%20Foundation%2C%0A%0AI%20would%20like%20to%20make%20a%20donation%3A%0A%0ADonation%20Type%3A%20%0AName%3A%20%0AAmount%3A%20R%20%0A" 
         target="_blank"
         class="whatsapp-btn">
         💬 Chat on WhatsApp
      </a>
      <p style="font-size:12px; color:#666; margin-top:10px;">We will send you banking details + receipt</p>
    </div>
  </div>
</body>
</html>
