<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - AL-SALAM | The Peace</title>
  
  <!-- SOCIAL ICONS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <style>
    html { scroll-behavior: smooth; } /* Smooth scrolling */
    * {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, sans-serif;}
    body { background:#f8fbf9; text-align:center; padding:0; color:#222; }
    
    /* STICKY NAVBAR - Same as index */
    .navbar {
      position: sticky;
      top: 0;
      background: #1a2a4a;
      color: white;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      border-bottom: 3px solid #16a34a; /* Green line */
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .navbar .logo { font-size: 20px; font-weight: bold; }
    .navbar .links a { 
      color: white; 
      text-decoration: none; 
      margin: 0 12px; 
      font-weight: 600; 
    }
    .navbar .links a:hover, .navbar .links a.active { color: #16a34a; }
    @media(max-width:600px){ .navbar .links a{margin:0 6px; font-size:14px;} }

    header { background:linear-gradient(135deg,#0e7c4b,#16a34a); color:white; padding:40px 20px; }
    header h1 { font-size:2em; margin-bottom:10px; }
    
    .container { max-width:1200px; margin:auto; padding:30px 20px; }
    
    /* RESPONSIVE GALLERY GRID */
    .gallery {
      display:grid;
      grid-template-columns:1fr; /* Phone: 1 column */
      gap:15px;
    }
    @media(min-width:600px){ 
      .gallery { grid-template-columns:repeat(2,1fr); } /* Tablet: 2 columns */
    }
    @media(min-width:900px){ 
      .gallery { grid-template-columns:repeat(3,1fr); } /* PC: 3 columns */
    }
    @media(min-width:1200px){ 
      .gallery { grid-template-columns:repeat(4,1fr); } /* Big PC: 4 columns */
    }
    
    .gallery img {
      width:100%;
      height:250px;
      object-fit:cover; /* keeps all images same size */
      border-radius:12px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      transition:transform 0.3s;
      cursor:pointer;
    }
    .gallery img:hover {
      transform:scale(1.03);
    }
    
    .btn-back {
      display:inline-block; 
      background:#16a34a; 
      color:white; 
      padding:12px 24px; 
      border-radius:8px; 
      text-decoration:none; 
      margin:30px 0; 
      font-weight:bold;
    }
    .btn-back:hover {background:#0e7c4b;}
    
    /* FOOTER WITH SOCIAL MEDIA - Same as index */
    footer {background:#0e7c4b; color:white; text-align:center; padding:30px 20px; margin-top:40px;}
    .social-icons a {
      color: white;
      font-size: 24px;
      margin: 0 12px;
      text-decoration: none;
    }
    .social-icons a:hover { color: #ffb700; }
    
    /* LIGHTBOX */
    #lightbox {
      display:none; position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.9); justify-content:center; align-items:center; z-index:1000; cursor:pointer; padding:20px;
    }
    #lightbox-img {max-width:90%; max-height:90%; border-radius:10px;}
  </style>
</head>
<body>

  <!-- STICKY NAVBAR -->
  

  <header>
    <h1>AL-SALAM GALLERY</h1>
    <p>Our Work in Inanda, South Africa</p>
  </header>
  <!-- STICKY NAVBAR WITH LOGO -->
<nav class="navbar">
  <div class="logo">
    <img src="logo.png" alt="AL-SALAM The Peace Logo" style="height:45px; width:auto;">
  </div>
  <div class="links">
    <a href="index.html">Home</a>
    <a href="index.html#about">About</a>
    <a href="gallery.html" class="active">Gallery</a>
    <a href="index.html#donate">Donate</a>
    <a href="index.html#contact">Contact</a>
  </div>
</nav>
  <div class="container">
    <div class="gallery">
      <img src="D1.jpg" alt="AL-SALAM Feeding Program">
      <img src="D2.jpg" alt="AL-SALAM Community Work">
      <img src="D3.jpg" alt="AL-SALAM Activity">
      <img src="D4.jpg" alt="AL-SALAM Activity">
      <img src="²nd D.jpg" alt="AL-SALAM Activity">
      <img src="D7.jpg" alt="AL-SALAM Activity">
      <img src="D8.jpg" alt="AL-SALAM Activity">
      <img src="²nd.jpg" alt="AL-SALAM Activity">
      <img src="Bread.jpg" alt="Bread Distribution">
      <img src="Mt.jpg" alt="AL-SALAM Activity">
      <img src="RaH.jpg" alt="AL-SALAM Activity">
    </div>
    
    <a href="index.html" class="btn-back">← Back to Home</a>
  </div>

  <!-- FOOTER WITH SOCIAL MEDIA -->
  <footer>
    <h3 style="margin-bottom:15px;">Follow Us</h3>
    <div class="social-icons">
      <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
      <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://wa.me/27627165789" target="_blank"><i class="fab fa-whatsapp"></i></a>
    </div>
    <p style="margin-top:20px;">© 2026 AL-SALAM | The Peace | Inanda, South Africa</p>
    <p>May Allah accept this sadaqah jariyah</p>
  </footer>

  <!-- Lightbox -->
  <div id="lightbox" onclick="this.style.display='none'">
    <img id="lightbox-img">
  </div>

  <script>
    document.querySelectorAll('.gallery img').forEach(img => {
      img.onclick = () => {
        document.getElementById('lightbox').style.display = 'flex';
        document.getElementById('lightbox-img').src = img.src;
      }
    });
  </script>
</body>
</html>
